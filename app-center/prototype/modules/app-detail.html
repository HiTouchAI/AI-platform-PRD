<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>应用详情</title><link rel="stylesheet" href="assets/base.css"></head><body><div data-appbar></div><main class="page narrow"><header class="page-header"><a class="back-link" href="app-center.html">← 返回应用中心</a><h1>应用详情</h1></header><div id="content"></div></main><script src="assets/data.js"></script><script src="assets/common.js"></script><script>const D=HiTouchDemo,id=Number(D.params().get('id')),app=D.getApp(id);const c=document.getElementById('content');if(!app||!app.online)c.innerHTML='<section class="card empty">应用不存在或已下架</section>';else c.innerHTML=`<section class="card card-body"><div class="app-main"><div class="app-icon">${D.escapeHtml(app.icon)}</div><div><h2>${D.escapeHtml(app.name)}</h2><div class="app-author">${D.escapeHtml(app.author)} · v${app.version} · 发布于 ${app.publishedAt}</div></div></div><h3 class="section-title">解决的问题</h3><p>${D.escapeHtml(app.problem)}</p><h3 class="section-title">适用场景</h3><p>${D.escapeHtml(app.scenario)}</p></section><section class="card card-body" style="margin-top:16px"><div class="stats">👍 点赞人数 ${app.likes}　👤 使用人数 ${app.usageUsers}　▶ 使用次数 ${app.usageCount}</div><div class="dialog-actions"><button class="btn btn-outline" id="like">${D.loadState().likedIds.includes(app.id)?'👍 已点赞':'👍 点赞'}</button><a class="btn btn-primary" href="renderer.html?appId=${app.id}&from=app-detail.html">▶ 使用</a></div></section>`;document.getElementById('like')?.addEventListener('click',()=>{D.toggleLike(app.id);location.reload()});</script></body></html>
