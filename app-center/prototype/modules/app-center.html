<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>应用中心 — HiTouch AI</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/base.css">
</head>
<body>
  <div data-appbar></div>
  <main class="page">
    <header class="page-header">
      <a class="back-link" href="index.html">← 工作台</a><h1>应用中心</h1>
    </header>
    <div class="search"><span class="search-icon">🔍</span><input id="search" type="search" placeholder="搜索应用名称、解决的问题、适用场景…" aria-label="搜索应用"><div class="search-hint">搜索范围：应用名称 · 解决的问题 · 适用场景</div></div>
    <div class="sort-row"><span>默认按点赞人数排序，同赞时发布时间更晚的应用在前</span><span id="count"></span></div>
    <section class="grid" id="app-grid"></section>
  </main>
  <script src="assets/data.js"></script><script src="assets/common.js"></script>
  <script>
    const D = HiTouchDemo;
    const grid = document.getElementById("app-grid");
    const search = document.getElementById("search");

    function render() {
      const state = D.loadState();
      const query = search.value.trim().toLocaleLowerCase("zh-CN");
      const apps = state.apps
        .filter(app => app.online && (!query || [app.name, app.problem, app.scenario].some(value => value.toLocaleLowerCase("zh-CN").includes(query))))
        .sort((a, b) => b.likes - a.likes || new Date(b.publishedAt) - new Date(a.publishedAt));
      document.getElementById("count").textContent = `共 ${apps.length} 个应用`;
      grid.innerHTML = apps.length ? apps.map(app => `
        <article class="card app-card">
          <div class="app-main">
            <div class="app-icon">${D.escapeHtml(app.icon)}</div>
            <div class="app-info"><div class="app-name">${D.escapeHtml(app.name)}</div><div class="app-author">${D.escapeHtml(app.author)} · v${D.escapeHtml(app.version)}</div><div class="app-problem">${D.escapeHtml(app.problem)}</div><div class="app-scenario">适用：${D.escapeHtml(app.scenario)}</div></div>
          </div>
          <div class="card-bottom"><button class="like-btn" data-like="${app.id}" aria-pressed="${state.likedIds.includes(app.id)}">${state.likedIds.includes(app.id) ? "👍" : "👍🏻"} ${app.likes}</button><span class="stat" title="使用人数">👤 ${app.usageUsers}</span><span class="stat" title="使用次数">▶️ ${app.usageCount}</span><a class="btn btn-primary btn-sm use-btn" href="${D.path("renderer.html", { appId: app.id, from: "app-center.html" })}">▶ 使用</a></div>
        </article>`).join("") : `<div class="card empty" style="grid-column:1/-1">没有找到匹配的应用</div>`;
      grid.querySelectorAll("[data-like]").forEach(button => button.onclick = () => {
        D.toggleLike(button.dataset.like);
        render();
      });
    }

    search.oninput = render;
    render();
    if (D.params().get("published") === "1") HiTouchUI.toast("发布成功，应用已对全部已登录同事可见。");
  </script>
</body>
</html>
